name: OA Daily Verified Metrics
on:
  schedule:
    - cron: '10 */2 * * *' # 每2小时，北京时间 00:10、02:10、...、22:10；GitHub定时任务可能延迟
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate data
        run: npm test
      - name: Apply manually audited exact public metrics
        run: node scripts/import-manual.mjs
      - name: Refresh verified public video statistics
        run: npm run update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Import verified public X post engagement snapshots (no API/login)
        run: node scripts/import-x-public.mjs
      - name: Synchronize published GitHub Pages dashboard
        run: node scripts/sync-pages.mjs
      - name: Validate refreshed data
        run: npm test
      - name: Commit genuine snapshots only
        run: |
          git config user.name oa-daily-bot
          git config user.email oa-daily-bot@users.noreply.github.com
          git add data/dashboard.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified OA metrics'
            git push
          fi
