name: OA Daily Verified Metrics
on:
  schedule:
    - cron: '10 0,6,12,18 * * *' # 北京时间 08:10, 14:10, 20:10, 02:10
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate data
        run: npm test
      - name: Refresh verified public video statistics
        run: npm run update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit genuine snapshots only
        run: |
          git config user.name oa-daily-bot
          git config user.email oa-daily-bot@users.noreply.github.com
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified OA metrics'
            git push
          fi
